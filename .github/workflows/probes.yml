name: probes

# The end-to-end game probes (docs/testing/game-probes.md): the running game is booted in a browser and driven through
# chargen, a dungeon, a town, a shop, fast travel, a save and load, the pause menu, and two clients online. The suite
# tests modules; these catch what a refactor of the host files (world.js, worldModes.js, the relay's Room) breaks in
# the wiring.
#
# They run on pull requests that touch the game, the relay or the account service, one runner per probe so that the
# slowest probe (online) sets the wall time. They are not part of the `check` job: ARENA2 comes from a download, and
# a probe that finds a bug in the game should not hide behind the suite's green. Chromium renders on SwiftShader here.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'server-account/**'
      - 'tools/probes/**'
      - 'tools/loadHarness.mjs'
      - 'tools/frameProbe.mjs'
      - 'tools/onlineFrameProbe.mjs'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/probes.yml'
  # A manual run repeats one probe, to tell a flaky probe from a real fault: `gh workflow run probes --ref <branch>
  # -f probe=save -f repeat=10`. Leave `probe` empty for one run of every probe.
  workflow_dispatch:
    inputs:
      probe:
        description: 'One probe to repeat (empty: every probe once)'
        required: false
        default: ''
      repeat:
        description: 'How many runs of that probe'
        required: false
        default: '5'

permissions:
  contents: read

concurrency:
  group: probes-${{ github.event_name }}-${{ inputs.probe }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          PROBE: ${{ inputs.probe }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          # run 0: a plain run, whose job keeps the name "probe <name>"; 1..N: the repeats of a manual run
          include=""
          if [ -n "$PROBE" ]; then
            for i in $(seq 1 "$REPEAT"); do include="$include{\"probe\":\"$PROBE\",\"run\":$i},"; done
          else
            for p in boot dungeon town travel rest save pause online; do include="$include{\"probe\":\"$p\",\"run\":0},"; done
          fi
          echo "matrix={\"include\":[${include%,}]}" >> "$GITHUB_OUTPUT"

  probe:
    needs: plan
    name: "probe ${{ matrix.probe }}${{ matrix.run > 0 && format(' #{0}', matrix.run) || '' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # every probe reports, so one red run shows every broken part
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cached dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Install the relay's tools (wrangler)
        if: matrix.probe == 'online'
        run: npm ci --prefix server
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Cached game data (ARENA2)
        id: arena
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/arena-data
          key: arena2-freeware-v1
      - name: Fetch ARENA2 (freeware Daggerfall data, never in the repository)
        if: steps.arena.outputs.cache-hit != 'true'
        run: sh tools/fetch-data.sh "$RUNNER_TEMP/arena-data"
      - name: Probe ${{ matrix.probe }}
        env:
          ARENA2_PATH: ${{ runner.temp }}/arena-data/arena2
          SHOT_DIR: ${{ runner.temp }}/probe-shots
        run: npm run probes -- ${{ matrix.probe }}
      - name: Keep the screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: probe-shots-${{ matrix.probe }}-${{ matrix.run }}
          path: ${{ runner.temp }}/probe-shots
          retention-days: 7
          if-no-files-found: ignore
