name: check

# The pull request's check. `plan` (tools/ci-plan.ts) chooses one of two runs:
#
# - The full verification (verify.yml: lint and types, every test in eight shards, the build), then test-times.yml.
#   It runs when the pull request is ready for review: on `ready_for_review` with no new push too, and on every push
#   to a ready pull request. A draft gets it with the full-ci label or when it changes a platform path. full-ci.yml
#   re-runs the last run when the label is added, so its `check` lands on the pull request as every other one does.
# - The light run on a draft (verify-light.yml: lint and types, the near tier of the tests on two runners).
#
# `check` is the status a merge waits on. It passes only when the full verification ran and passed, so a light run
# never satisfies it: on a draft it fails and says that the full run comes at ready. It runs whatever happened above
# it (`always()`), because a required check that is skipped counts as a pass.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: full or light
    runs-on: ${{ github.event.repository.private && vars.DFO_CI != 'hosted' && 'dfo-self-hosted' || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read   # the draft state and the labels, read when the job runs
    outputs:
      full: ${{ steps.plan.outputs.full }}
    steps:
      # The pull request's merge commit and its parents: HEAD^1 is the base it merges into
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        run: node tools/ci-plan.ts
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

  verify:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/verify.yml

  # The shards' times this green run recorded, saved for the next run's split (test-times.yml), beside `check`, which
  # never waits on it
  times:
    needs: [verify]
    uses: ./.github/workflows/test-times.yml
    with:
      planned: ${{ needs.verify.outputs.times }}

  light:
    needs: plan
    if: needs.plan.outputs.full == 'false'
    uses: ./.github/workflows/verify-light.yml

  check:
    if: ${{ always() }}
    needs: [plan, verify, light]
    runs-on: ${{ github.event.repository.private && vars.DFO_CI != 'hosted' && 'dfo-self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Every part of the full verification passed
        run: |
          if [ "${{ needs.plan.outputs.full }}" != "true" ]; then
            echo "::error::a light run (light: ${{ needs.light.result }}) never passes check. The full verification runs when the pull request is marked ready, or on a draft with the full-ci label"
            exit 1
          fi
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "::error::the check did not pass (verify: ${{ needs.verify.result }}) - see its lint, test and build jobs"
            exit 1
          fi
          echo "lint, types, every test shard and the build passed"

  # Formatting of the files this pull request adds, Markdown and spelling of the ones it changes, and decision, pull
  # request and item tags in the comments it adds (docs/coding-standards.md). A job of its own: `check` stays the lint,
  # types, tests and build, and a branch rule may require this one too. The merge commit and its parents are enough:
  # HEAD^1 is the base, and every blob the diff reads comes with the two commits, so no later fetch needs a token.
  standards:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ github.event.repository.private && vars.DFO_CI != 'hosted' && 'dfo-self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Formatting of the added files
        run: node tools/check-changed.mjs format-check --added
        env:
          BASE_REF: HEAD^1
      - name: Markdown of the changed files
        run: npm run markdown
        env:
          BASE_REF: HEAD^1
      - name: Spelling of the changed files
        run: npm run spell
        env:
          BASE_REF: HEAD^1
      - name: References in the comments this pull request adds
        run: npm run comment-refs
        env:
          BASE_REF: HEAD^1
