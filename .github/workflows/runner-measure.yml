name: runner-measure
# Temporary: measures what a test shard, the build, lint and types, and three probes need in CPU and RAM, pinned to 4 and
# to 2 cores, for the self-hosted runner budget. Removed before merge.
on:
  pull_request:
    paths:
      - '.github/workflows/runner-measure.yml'
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sh tools/fetch-vendor.sh
      - name: Header
        run: |
          echo "| job | cores | wall s | peak RAM added MB | CPU busy % | peak tasks added | exit |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          nproc; free -m | head -2
      - run: tools/ci-runner/measure-job.sh shard-1of8 0-3 node tools/testShards.mjs 1/8
        continue-on-error: true
      - run: tools/ci-runner/measure-job.sh shard-1of8 0-1 node tools/testShards.mjs 1/8
        continue-on-error: true
      - run: tools/ci-runner/measure-job.sh shard-5of8 0-3 node tools/testShards.mjs 5/8
        continue-on-error: true
      - run: tools/ci-runner/measure-job.sh build 0-3 npm run build
        continue-on-error: true
      - run: tools/ci-runner/measure-job.sh build 0-1 npm run build
        continue-on-error: true
      - run: tools/ci-runner/measure-job.sh lint+types 0-3 bash -c 'npm run lint && npm run types'
        continue-on-error: true
      - run: tools/ci-runner/measure-job.sh lint+types 0-1 bash -c 'npm run lint && npm run types'
        continue-on-error: true
  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: sh tools/fetch-vendor.sh
      - run: npx playwright install --with-deps chromium
      - run: sh tools/fetch-data.sh "$RUNNER_TEMP/arena-data"
      - run: |
          echo "| job | cores | wall s | peak RAM added MB | CPU busy % | peak tasks added | exit |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
      - name: probes at 4 and 2 cores
        env:
          ARENA2_PATH: ${{ runner.temp }}/arena-data/arena2
          SHOT_DIR: ${{ runner.temp }}/probe-shots
        run: |
          for cpus in 0-3 0-1; do
            for p in dungeon save online; do
              tools/ci-runner/measure-job.sh "probe-$p" "$cpus" npm run probes -- "$p" || true
            done
          done
