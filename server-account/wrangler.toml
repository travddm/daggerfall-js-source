# ACC1b (2026-09-21): THE ACCOUNT SERVICE. A second Cloudflare Worker
# over D1, deliberately NOT a route on the relay.
#
# WHY TWO WORKERS: a relay deploy restarts every Durable Object and
# drops every connected player. That is a fair price for changing the
# relay's own law and an absurd one for fixing a sign-in button - and
# SLAM8 hashes the RAW BYTES of everything the relay bundles, so the
# price would be charged for a comment. `server/wrangler.toml` carries
# the other half of this note.
#
# THE SEAM BETWEEN THEM IS A SIGNATURE. This service holds the private
# key; the relay holds the public half and can verify but never mint.
#
# ─── THE DEPLOY IS AUTOMATIC, AND SO IS EVERYTHING BEFORE IT ───────
# Mac (2026-09-21): "The token provided allows you to take this on
# yourself. I am not needed at all."
#
# `.github/workflows/account-deploy.yml` does all four steps on every
# push to main that touches this service, with the Cloudflare API token
# read from `secrets.CLOUDFLARE_API_TOKEN`, where it already lives for
# the relay. NOBODY TYPES A CREDENTIAL ANYWHERE. Every step is
# idempotent, so the job is safe to re-run and a deploy that failed is
# retried by the next push instead of silently staying stale:
#
#   1. Create the database if it is not there, then read its id back
#      out of Cloudflare and write it into this file's copy IN THE
#      RUNNER. The id below is a sentinel on purpose - see the binding.
#   2. `wrangler d1 migrations apply`, which keeps its own
#      `d1_migrations` table and so applies each file exactly once, in
#      order. That is why it replaced a pair of `d1 execute --file`
#      lines: 0002 is NOT idempotent (`ALTER TABLE ADD COLUMN` has no
#      IF NOT EXISTS), and "remember to run each one once" is not a
#      property, it is a hope. Now the tool remembers.
#   3. Mint the signing pair, but ONLY IF THERE IS NOT ONE ALREADY -
#      re-minting invalidates every token in flight. Both halves go in
#      from a pipe; neither is echoed, written to a file, or put on a
#      command line.
#   4. Deploy, then verify /v1/health names this deploy - a wrangler
#      exit code of 0 over an unchanged Worker is a green deploy that
#      did not happen.
#
# A DEPLOY HERE DROPS NOBODY. That is the entire point of the split:
# this Worker holds no sockets, so it can be fixed at any hour - which
# is also why this one may fire on a path filter where the relay's
# deploy may not.
name = "daggerfall-accounts"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "a27adccb38c8e8b82fa32e5736274a94"
workers_dev = true

# An uncaught error is logged, not lost - AUDIT ONLINE A17's law, on
# this side too.
[observability]
enabled = true

# SCALE1 (2026-09-30, the scaling audit): EVERY REQUEST COUNTED - route,
# method, status, a refusal's word, wall ms and the D1 statements it ran
# - to Workers Analytics Engine (src/metrics.js says what each field is
# and how to query it). The dataset is created by its first write; no
# player is identified in any point. A Worker without the binding serves
# exactly as before.
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "daggerfall_accounts"

# D1-NEAR (2026-10-12, from play: "a lot of UI elements that utilize the
# server (like searching players, the guild menu, etc) take an insane
# amount of time to load"; bible/11-Multiplayer/Scale-Arc.md D1-NEAR,
# audited in bible/01-Overview/audits/Audit-D1-Near.md): THE WORKER RUNS BESIDE
# ITS DATABASE'S PRIMARY, BY NAME. A request here makes its D1 round trips
# one after another - a guild look thirteen or fourteen, a seat board
# nineteen to thirty-five - and each pays the distance between the Worker
# and the primary, so what a route costs is that distance times its round
# trips.
#
# SCALE1 set `mode = "smart"` on the word that Cloudflare would run the
# Worker near the database, and nothing said where it ran. On 2026-10-12
# it ran in SYDNEY (`cf-placement: remote-SYD` on 2,208 answers of 2,238)
# while one statement on the primary cost it ~150-180 ms: the primary is
# in western North America (the record has the bounds), and a guild look
# spent some 2-2.5 s on round trips before any load. Cloudflare says Smart
# Placement weighs request durations in places the Worker has already run;
# why it chose Sydney, it does not say.
#
# `region` runs the Worker beside the cloud region named - Northern
# California, central to western North America: a player pays one trip to
# it, and each statement after that costs D1's own time and a short hop.
# D1 placed the primary when the database was made and does not currently
# move it. Every deploy reads, and says, where D1 says its primary answered
# from, where the Worker runs, and what a statement costs it there
# (account-deploy.yml, "Report where the account Worker runs"): a primary
# not near this region is the cue to change this line.
[placement]
region = "aws:us-west-1"

# SCALE4b (2026-10-08): THE SERVICE'S OWN CLOCK (src/cron.js). Every
# minute the settlements a read should not wait on (the auctions, the
# guilds' writs and contracts, the seats' Turning, the day's
# Motherlodes); each hour the sweeps no read runs any more and the
# retention the tables never had. The two strings are src/cron.js's
# CRON_MINUTE and CRON_HOUR - test/server/scale4b.test.js holds them together,
# because a schedule this file names and the module does not runs
# nothing. `wrangler deploy` publishes them with the Worker.
[triggers]
crons = ["* * * * *", "41 * * * *"]

